name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # Navigates into MandirManager and grants permission
      - name: Grant Execute Permission for Gradlew
        run: |
          cd MandirManager
          chmod +x gradlew

      - name: Generate Both Signing Reports
        env:
          # Replace these right-side values with the exact names used in your release/build step
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.SIGNING_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          cd MandirManager
          ./gradlew assembleDebug
          ./gradlew signingReport
    # 1. Force the runner to generate the missing debug. keystore file
       
     # 2. Output the complete report containing both keys
    
      # Navigates into MandirManager and compiles the APK
      - name: Compile and Build APK
        run: |
          cd MandirManager
          ./gradlew assembleDebug

      # Uploads the finished APK from the MandirManager app path
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mandir-app-debug-apk
          path: MandirManager/app/build/outputs/apk/debug/*.apk
